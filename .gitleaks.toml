title = "sgr-registry"

[extend]
useDefault = true

[[allowlists]]
description = "Documented local-only demo placeholders, never production credentials"
paths = [
  '''(.*)/node_modules/.*''',
  '''(.*)/\.next/.*''',
  '''(.*)/\.next-e2e/.*''',
  '''(.*)/dist/.*''',
  '''(.*)/test-results/.*''',
  '''(.*)/\.env\.example$''',
  '''(.*)/infra/docker/compose\.yaml$''',
  '''(.*)/infra/docker/compose\.production\.yaml$''',
  '''(.*)/infra/docker/redis/acl-entrypoint\.sh$''',
  '''(.*)/infra/docker/secrets/.*''',
  '''(.*)/scripts/dev/sync-redis-secrets\.mjs$''',
  '''(.*)/\.gitleaks\.toml$''',
]
regexes = [
  '''Dana-SGR-Demo-2026!''',
  '''sgr_registry_dev_password''',
  '''sgr_minio_dev_password''',
  '''local-development-only''',
]

[[allowlists]]
description = "CycloneDX checksum fields in the SBOM index. Path exclusions are not used because they skip the whole file."
condition = "AND"
regexTarget = "line"
regexes = ['''"[A-Za-z0-9._-]+\.cdx\.json"\s*:\s*"[a-f0-9]{64}"''']
