# Production stack. Inject secrets on the host. Do not commit infra/docker/secrets.
# The only published ports belong to the reverse proxy.
# Migrations are a separate profile: docker compose --profile migrate run --rm migrator
# Seed and database reset are not part of this file.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-hardening: &hardening
  init: true
  platform: ${SGR_PLATFORM:-linux/amd64}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-app-fs: &app-fs
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
  logging: *logging
  networks:
    - sgr_internal

services:
  proxy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    <<: *hardening
    ports:
      - '80:80'
      - '443:443'
    environment:
      SGR_TLS_DOMAIN: ${SGR_TLS_DOMAIN:?SGR_TLS_DOMAIN is required}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - ./secrets/tls:/etc/caddy/tls:ro
      - sgr_caddy_data:/data
      - sgr_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:80/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  web:
    image: sgr-registry-web:${SGR_IMAGE_TAG:?SGR_IMAGE_TAG is required}@${SGR_WEB_IMAGE_DIGEST:?SGR_WEB_IMAGE_DIGEST is required}
    <<: [*hardening, *app-fs]
    user: '10001:10001'
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    env_file:
      - ./secrets/app.env
    environment:
      NODE_ENV: production
      PORT: '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  api:
    image: sgr-registry-runtime:${SGR_IMAGE_TAG:?SGR_IMAGE_TAG is required}@${SGR_RUNTIME_IMAGE_DIGEST:?SGR_RUNTIME_IMAGE_DIGEST is required}
    <<: [*hardening, *app-fs]
    user: '10001:10001'
    env_file:
      - ./secrets/app.env
    environment:
      NODE_ENV: production
    command: ['node', 'apps/api/dist/main.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M

  worker:
    image: sgr-registry-runtime:${SGR_IMAGE_TAG:?SGR_IMAGE_TAG is required}@${SGR_RUNTIME_IMAGE_DIGEST:?SGR_RUNTIME_IMAGE_DIGEST is required}
    <<: [*hardening, *app-fs]
    user: '10001:10001'
    env_file:
      - ./secrets/app.env
    environment:
      NODE_ENV: production
    command: ['node', 'apps/worker/dist/main.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M

  migrator:
    profiles: ['migrate']
    image: sgr-registry-migrator:${SGR_IMAGE_TAG:?SGR_IMAGE_TAG is required}@${SGR_MIGRATOR_IMAGE_DIGEST:?SGR_MIGRATOR_IMAGE_DIGEST is required}
    <<: [*hardening, *app-fs]
    user: '10001:10001'
    restart: 'no'
    env_file:
      - ./secrets/app.env
    environment:
      NODE_ENV: production
    command:
      [
        'node',
        'packages/database/node_modules/prisma/build/index.js',
        'migrate',
        'deploy',
        '--schema',
        'packages/database/prisma/schema.prisma',
        '--config',
        'packages/database/prisma.config.ts',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    <<: *hardening
    environment:
      POSTGRES_USER: sgr_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: sgr_registry
    secrets:
      - postgres_password
    volumes:
      - sgr_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgr_owner -d sgr_registry']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    <<: *hardening
    command: ['/usr/local/bin/sgr-redis-acl-entrypoint.sh']
    environment:
      REDIS_API_PASSWORD_FILE: /run/secrets/redis_api_password
      REDIS_WORKER_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_api_password
      - redis_worker_password
    volumes:
      - ./redis/acl-entrypoint.sh:/usr/local/bin/sgr-redis-acl-entrypoint.sh:ro
      - sgr_redis:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_api_password)" redis-cli --user sgr_api ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  object-storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    <<: *hardening
    entrypoint: ['/bin/sh', '/opt/sgr/seaweed-entrypoint.sh']
    pids_limit: 512
    environment:
      S3_ACCESS_KEY_FILE: /run/secrets/object_storage_access_key
      S3_SECRET_KEY_FILE: /run/secrets/object_storage_secret_key
    secrets:
      - object_storage_access_key
      - object_storage_secret_key
    volumes:
      - sgr_seaweedfs:/data
      - ./seaweed/entrypoint.sh:/opt/sgr/seaweed-entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
          pids: 512

  clamav:
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    <<: *hardening
    pids_limit: 256
    tmpfs:
      - /tmp:size=64M
    volumes:
      - sgr_clamav:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG']
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 180s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
          pids: 256

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_api_password:
    file: ./secrets/redis_api_password
  redis_worker_password:
    file: ./secrets/redis_worker_password
  object_storage_access_key:
    file: ./secrets/object_storage_access_key
  object_storage_secret_key:
    file: ./secrets/object_storage_secret_key

networks:
  sgr_internal:
    driver: bridge

volumes:
  sgr_postgres:
  sgr_redis:
  sgr_seaweedfs:
  # Former RustFS volume. Not mounted. Do not delete it.
  sgr_object_storage:
  # Legacy MinIO volume. Not mounted. Do not delete it.
  sgr_minio:
  sgr_clamav:
  sgr_caddy_data:
  sgr_caddy_config:
