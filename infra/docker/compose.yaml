services:
  postgres:
    image: postgres:18
    container_name: sgr-registry-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgr_registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgr_registry_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sgr_registry}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sgr_registry_pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-sgr_registry} -d ${POSTGRES_DB:-sgr_registry}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sgr-registry-redis
    command: ['/usr/local/bin/sgr-redis-acl-entrypoint.sh']
    environment:
      REDIS_API_PASSWORD_FILE: /run/secrets/redis_api_password
      REDIS_WORKER_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_api_password
      - redis_worker_password
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - ./redis/acl-entrypoint.sh:/usr/local/bin/sgr-redis-acl-entrypoint.sh:ro
      - sgr_registry_redis:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_api_password)" redis-cli --user sgr_api ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  object-storage:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: sgr-registry-object-storage
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY:-sgr_minio_admin}}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-${S3_SECRET_KEY:-sgr_minio_dev_password}}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - '127.0.0.1:${S3_API_PORT:-9000}:9000'
    volumes:
      - sgr_registry_object_storage:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 1g

  clamav:
    # Immutable index digest of clamav/clamav-debian:1.4 (includes linux/arm64).
    # Refresh: docker pull clamav/clamav-debian:1.4 && docker image inspect clamav/clamav-debian:1.4 --format '{{index .RepoDigests 0}}'
    image: clamav/clamav-debian:1.4@sha256:f6da737f9399d6a1851c463b2f88d02021a67f969ec42dd6e1751fecf7c3de4f
    container_name: sgr-registry-clamav
    ports:
      - '127.0.0.1:${CLAMD_PORT:-3310}:3310'
    volumes:
      - sgr_registry_clamav:/var/lib/clamav
      - ./clamav/sgr-test.ndb:/var/lib/clamav/sgr-test.ndb
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  mailpit:
    # Immutable index digest of axllent/mailpit:v1.27.10 (includes linux/arm64).
    # Refresh: docker pull axllent/mailpit:v1.27.10 && docker image inspect axllent/mailpit:v1.27.10 --format '{{index .RepoDigests 0}}'
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    container_name: sgr-registry-mailpit
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: '5000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8025/livez']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

secrets:
  redis_api_password:
    file: ./secrets/redis_api_password
  redis_worker_password:
    file: ./secrets/redis_worker_password

volumes:
  sgr_registry_pgdata:
  sgr_registry_redis:
  sgr_registry_object_storage:
  # Legacy MinIO volume. Not mounted. Do not delete it in this change.
  sgr_registry_minio:
  sgr_registry_clamav:
