services:
  postgres:
    image: postgres:18
    container_name: sgr-registry-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgr_registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgr_registry_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sgr_registry}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sgr_registry_pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-sgr_registry} -d ${POSTGRES_DB:-sgr_registry}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sgr-registry-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - sgr_registry_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sgr-registry-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sgr_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sgr_minio_dev_password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - sgr_registry_minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  clamav:
    # Immutable index digest of clamav/clamav-debian:1.4 (includes linux/arm64).
    # Refresh: docker pull clamav/clamav-debian:1.4 && docker image inspect clamav/clamav-debian:1.4 --format '{{index .RepoDigests 0}}'
    image: clamav/clamav-debian:1.4@sha256:f6da737f9399d6a1851c463b2f88d02021a67f969ec42dd6e1751fecf7c3de4f
    container_name: sgr-registry-clamav
    ports:
      - '127.0.0.1:${CLAMD_PORT:-3310}:3310'
    volumes:
      - sgr_registry_clamav:/var/lib/clamav
      - ./clamav/sgr-test.ndb:/var/lib/clamav/sgr-test.ndb
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

volumes:
  sgr_registry_pgdata:
  sgr_registry_redis:
  sgr_registry_minio:
  sgr_registry_clamav:
