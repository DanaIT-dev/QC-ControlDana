services:
  postgres:
    image: postgres:18
    container_name: sgr-registry-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgr_registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgr_registry_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sgr_registry}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sgr_registry_pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-sgr_registry} -d ${POSTGRES_DB:-sgr_registry}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sgr-registry-redis
    command: ['/usr/local/bin/sgr-redis-acl-entrypoint.sh']
    environment:
      REDIS_API_PASSWORD_FILE: /run/secrets/redis_api_password
      REDIS_WORKER_PASSWORD_FILE: /run/secrets/redis_worker_password
    secrets:
      - redis_api_password
      - redis_worker_password
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - ./redis/acl-entrypoint.sh:/usr/local/bin/sgr-redis-acl-entrypoint.sh:ro
      - sgr_registry_redis:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_api_password)" redis-cli --user sgr_api ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  object-storage:
    # Official SeaweedFS 4.48. Manifest list includes linux/amd64. The image
    # entrypoint starts as root only long enough to chown /data, then su-exec
    # drops the server to uid 1000. cap_drop ALL blocks that drop, so it is omitted.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: sgr-registry-object-storage
    entrypoint: ['/bin/sh', '/opt/sgr/seaweed-entrypoint.sh']
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY:-sgr_minio_admin}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${S3_SECRET_KEY:-sgr_minio_dev_password}}
    ports:
      - '127.0.0.1:${S3_API_PORT:-9000}:9000'
    volumes:
      - sgr_registry_seaweedfs:/data
      - ./seaweed/entrypoint.sh:/opt/sgr/seaweed-entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g

  clamav:
    # Official Alpine image clamav/clamav:1.5.4. The index published on 2026-09-28
    # contains linux/amd64 only. libxml2 is 2.13.9-r2, outside CVE-2026-6653.
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    container_name: sgr-registry-clamav
    ports:
      - '127.0.0.1:${CLAMD_PORT:-3310}:3310'
    volumes:
      - sgr_registry_clamav:/var/lib/clamav
      - ./clamav/sgr-test.ndb:/var/lib/clamav/sgr-test.ndb
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  mailpit:
    # Immutable index digest of axllent/mailpit:v1.27.10 (includes linux/arm64).
    # Refresh: docker pull axllent/mailpit:v1.27.10 && docker image inspect axllent/mailpit:v1.27.10 --format '{{index .RepoDigests 0}}'
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    container_name: sgr-registry-mailpit
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: '5000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8025/livez']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

secrets:
  redis_api_password:
    file: ./secrets/redis_api_password
  redis_worker_password:
    file: ./secrets/redis_worker_password

volumes:
  sgr_registry_pgdata:
  sgr_registry_redis:
  sgr_registry_seaweedfs:
  # Former RustFS volume. Not mounted. Do not delete it.
  sgr_registry_object_storage:
  # Legacy MinIO volume. Not mounted. Do not delete it.
  sgr_registry_minio:
  sgr_registry_clamav:
