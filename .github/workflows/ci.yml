name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format, tests, build, and scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the local example environment
        run: cp .env.example .env

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm --filter @sgr-registry/database exec prisma validate

      - name: Validate Compose files
        run: |
          docker compose -f infra/docker/compose.yaml --env-file .env.example config --quiet
          node scripts/security/validate-production-compose.mjs
          node scripts/release/validate-staging-compose.mjs

      - name: Start isolated infrastructure
        run: pnpm infra:up

      - name: Provision database roles
        run: pnpm db:roles:provision

      - name: Apply migrations to the test database
        run: |
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          export MIGRATION_DATABASE_URL="$TEST_DATABASE_URL"
          pnpm db:migrate

      - name: Database and API integration
        run: pnpm test:integration

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Full Playwright
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Fail when a Playwright test was skipped
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("test-results/e2e/results.json", "utf8"));
            const stats = report.stats ?? {};
            const skipped = Number(stats.skipped ?? 0);
            const unexpected = Number(stats.unexpected ?? 0);
            if (!Number.isFinite(skipped) || skipped > 0 || unexpected > 0) {
              console.error(JSON.stringify(stats));
              process.exit(1);
            }
          '

      - name: Build
        run: pnpm build

      - name: Semgrep, Gitleaks, and Trivy
        run: bash scripts/security/run-sast.sh

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/e2e
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop infrastructure
        if: always()
        run: pnpm infra:down
